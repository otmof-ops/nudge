<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" width="240" height="290" role="img" aria-label="the Nudge Bunny, happy">
  <title>the Nudge Bunny (happy)</title>
  <g id="body">
    <circle cx="66" cy="246" r="10" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <ellipse cx="120" cy="240" rx="50" ry="36" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <ellipse cx="98" cy="270" rx="17" ry="8" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <ellipse cx="142" cy="270" rx="17" ry="8" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <path d="M90 268 v5 M98 269 v5 M106 268 v5 M134 268 v5 M142 269 v5 M150 268 v5" stroke="#C9C1B3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="92" cy="238" r="11" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <!-- the raised arm: an outlined tube from the shoulder to a paw beside the ear -->
    <path d="M158 226 q22 -26 24 -58" stroke="#C9C1B3" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M158 226 q22 -26 24 -58" stroke="#F6F3EC" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="183" cy="166" r="12" fill="#F6F3EC" stroke="#C9C1B3" stroke-width="3"/>
    <path d="M176 160 l-4 -7 M183 157 l0 -8 M190 160 l4 -7" stroke="#C9C1B3" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g id="ears" stroke="#C9C1B3" stroke-width="3">
    <g transform="translate(96 118) rotate(-14)">
      <rect x="-19" y="-118" width="38" height="124" rx="19" fill="#F6F3EC"/>
      <rect x="-10" y="-102" width="20" height="92" rx="10" fill="#F9C3CE" stroke="none"/>
    </g>
    <g transform="translate(144 118) rotate(14)">
      <rect x="-19" y="-118" width="38" height="124" rx="19" fill="#F6F3EC"/>
      <rect x="-10" y="-102" width="20" height="92" rx="10" fill="#F9C3CE" stroke="none"/>
    </g>
  </g>
  <g id="head">
